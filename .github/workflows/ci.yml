name: CI

# Runs on every pull request, and on pushes to main after merge.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # The other three steps never compile the app, so anything that only
      # fails at build time reached production unchallenged — that's how the
      # font regression got in (next/font fetches at build time, so a broken
      # font is a build failure and nothing else). Env vars are dummies: this
      # proves it compiles, it doesn't talk to Supabase or Stripe.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
          SUPABASE_SECRET_KEY: build-only-placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_build_only
          STRIPE_SECRET_KEY: sk_test_build_only
          STRIPE_WEBHOOK_SECRET: whsec_build_only
