name: Recover pending work

on:
  schedule:
    # A backup only. GitHub drops most scheduled runs (8 in two days, hours
    # apart); the five-minute guarantee is the database's pg_cron job
    # 'tabletap-recover' (supabase/schema.sql), plus Vercel's daily cron.
    # Away from the top of the hour, when scheduled runners are busiest.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions: {}
concurrency:
  group: production-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'josuealmonasi/table-tap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # A fixed Node, not whatever the runner image ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: node scripts/recover-production.mjs
