name: Recover pending work

on:
  schedule:
    # Away from the top of the hour, when scheduled runners are busiest.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions: {}
concurrency:
  group: production-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'josuealmonasi/table-tap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node scripts/recover-production.mjs
