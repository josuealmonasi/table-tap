# The throwaway Supabase stack the GitHub gates run against
# (.github/workflows/gates.yml). Started with `supabase start --workdir ci`
# inside one CI job and gone when the job ends. It is never linked to a hosted
# project: nothing here can reach the dev or production databases.
#
# The schema is NOT applied from here. `pnpm db:create` loads
# supabase/schema.sql, exactly as on the dev project, so CI tests that file.
project_id = "tabletap-ci"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

# The gates sign in hundreds of times from one address within minutes; the
# local defaults (30 sign-ins per 5 minutes) would refuse most of them and the
# refusals would read as broken logins.
[auth.rate_limit]
email_sent = 1000
sms_sent = 1000
anonymous_users = 1000
token_refresh = 100000
sign_in_sign_ups = 100000
token_verifications = 100000
web3 = 1000

[auth.email]
enabled = true
double_confirm_changes = false
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"

[edge_runtime]
enabled = false

[analytics]
enabled = false
